<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBTI-PLUS｜sbti-final-selfhost</title>
  <style>
    :root {
      --bg: #07111e;
      --panel: rgba(255,255,255,.08);
      --panel2: rgba(255,255,255,.05);
      --border: rgba(255,255,255,.14);
      --text: #f4f7ff;
      --muted: #b7c2df;
      --accent: #8b5cf6;
      --accent2: #06b6d4;
      --ok: #34d399;
      --warn: #fbbf24;
      --shadow: 0 18px 48px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1a2950 0%, #07111e 44%, #040811 100%);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 56px; }
    .topbar { margin-bottom: 18px; }
    .back { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:14px; text-decoration:none; color:var(--text); background:var(--panel2); border:1px solid var(--border); }
    .hero, .sticky, .card, .result, .dim, .pattern-card {
      border:1px solid var(--border); border-radius:24px; background:var(--panel); box-shadow:var(--shadow); backdrop-filter:blur(10px);
    }
    .hero { padding:28px; }
    h1 { margin:0 0 12px; font-size: clamp(30px, 5vw, 46px); }
    .lead { color:var(--muted); line-height:1.85; margin:0; }
    .note { margin-top:16px; padding:14px 16px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#d7e0fc; line-height:1.8; }
    .pill-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .pill { padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06); color:#d5ddfb; font-size:13px; }
    .sticky {
      position: sticky; top: 12px; z-index: 20; margin: 18px 0;
      display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;
      padding:16px 18px; background: rgba(8,12,25,.82);
    }
    button { border:none; cursor:pointer; color:#fff; font-weight:700; padding:12px 18px; border-radius:14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    button.secondary { background:rgba(255,255,255,.08); border:1px solid var(--border); }
    .progress { color:var(--muted); }
    .list { display:grid; gap:16px; }
    .card { padding:22px; }
    .qhead { display:flex; gap:12px; align-items:flex-start; }
    .qid { min-width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:800; background: linear-gradient(135deg, rgba(139,92,246,.92), rgba(6,182,212,.85)); }
    .qmeta { color:#9fe6c8; font-size:12px; margin-top:6px; }
    .qtext { font-size:18px; line-height:1.75; }
    .options { display:grid; gap:10px; margin-top:16px; }
    .option { padding:14px 16px; border-radius:16px; border:1px solid var(--border); background:rgba(255,255,255,.04); }
    .option label { display:flex; gap:12px; align-items:flex-start; cursor:pointer; line-height:1.75; }
    .hidden { display:none; }
    .result { margin-top:26px; padding:28px; }
    .code { display:inline-block; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); margin-bottom:10px; }
    .result h2 { margin:0 0 6px; font-size:36px; }
    .intro { font-size:18px; color:#d9e3ff; margin-bottom:10px; }
    .desc { color:var(--muted); line-height:1.9; }
    .dim-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin-top:20px; }
    .dim { padding:18px; }
    .dim h3 { margin:0 0 8px; font-size:18px; }
    .dim p { margin:0; color:var(--muted); line-height:1.7; }
    .pattern-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-top:20px; }
    .pattern-card { padding:18px; }
    .pattern-card h4 { margin:0 0 8px; }
    .small { color:#9caad4; font-size:14px; line-height:1.75; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><a class="back" href="../../index.html">← 返回测试主页</a></div>

    <section class="hero">
      <h1>SBTI-PLUS｜sbti-final-selfhost</h1>
      <p class="lead">
        这是 SBTI 的升级版本。系统会根据你的作答生成 15 个维度的 L / M / H 向量，再与预设人格库进行匹配，输出最佳人格代码、匹配度、维度解释和特殊隐藏判定结果。
      </p>
      <div class="note">
        作答说明：请按“更像现在的你”来回答，不要按理想状态作答。本测试为娱乐向人格匹配，不替代正式心理评估。
      </div>
      <div class="pill-row">
        <span class="pill">15维度</span>
        <span class="pill">31~32题</span>
        <span class="pill">常规人格库 + 特殊判定</span>
      </div>
    </section>

    <div class="sticky">
      <div class="progress">已作答 <strong id="answeredCount">0</strong> / <span id="totalCount">31</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="secondary" id="resetBtn" type="button">清空重做</button>
        <button id="submitBtn" type="button">生成人格结果</button>
      </div>
    </div>

    <section id="questionList" class="list"></section>
    <section id="resultBox" class="result hidden"></section>
  </main>

  <script>

      { id:'q2', dim:'S1', t:'当你做得还不错时，你通常会：', options:[['A','认可自己这次确实发挥得可以',3],['B','还行吧，先别吹太早',2],['C','总觉得别人迟早会发现我只是运气好',1]] },

    const specialQ1 = { id:'drink_gate_q1', t:'您平时有什么爱好？', options:[['A','吃喝拉撒',1],['B','艺术爱好',2],['C','饮酒',3],['D','健身',4]] };

      GOGO:['行者','gogogo~出发咯','你偏行动导向，很多事对你来说不是讨论题，而是待办项。'],
      SEXY:['尤物','您就是天生的尤物！','你存在感很强，不一定要费劲表达，也容易被人注意到。'],
      LOVER:['多情者','爱意太满，现实显得有点贫瘠。','你情感浓度高，容易把关系和体验活成连续剧。'],
      MUM:['妈妈','或许...我可以叫你妈妈吗....?','你有安抚力和共情力，常常先照顾别人，再慢慢照顾自己。'],
      FAKE:['伪人','已经，没有人类了。','你很会根据场景切换表达方式，像高性能社交变形器。'],
      OJBK:['无所谓人','我说随便，是真的随便。','你对很多外部选择并不想过度投入，主打一个都行。'],
      MALO:['吗喽','人生是个副本，而我只是一只吗喽。','你不爱被文明流程过度驯化，更喜欢有趣和灵活的活法。'],
      JOKER:['小丑','原来我们都是小丑。','你很会制造气氛，但有时笑声下面也藏着没说出口的东西。'],
      WOC:['握草人','卧槽，我怎么是这个人格？','你表面惊叹，后台冷静，很多事其实都在你意料之中。'],
      THINK:['思考者','已深度思考100s。','你擅长分析、归档、拆逻辑，不容易轻易跟风。'],
      SHIT:['愤世者','这个世界，构石一坨。','你嘴上吐槽世界，手上却常常默默把烂摊子收拾明白。'],
      ZZZZ:['装死者','我没死，我只是在睡觉。','你平时像离线，死线一到却会突然苏醒并完成任务。'],
      POOR:['贫困者','我穷，但我很专。','你会把资源压成一束激光，不重要的都降噪，重要的狠狠干到底。'],
      MONK:['僧人','没有那种世俗的欲望。','你很重视个人空间和独立轨道，不喜欢被关系过度侵入。'],
      IMSB:['傻者','认真的么？我真的是傻逼么？','你内心常有“想冲”和“自我否定”两股力量同时打架。'],
      SOLO:['孤儿','我哭了，我怎么会是孤儿？','你容易先把自己围起来，怕靠太近，也怕别人离开。'],
      FUCK:['草者','操！这是什么人格？','你有很强的生命力和反驯化倾向，不太愿意被规则轻松收编。'],
      DEAD:['死者','我，还活着吗？','你像是把很多外界拉扯都看淡了，对喧闹世界保持距离。'],
      IMFW:['废物','我真的...是废物吗？','你不是没价值，只是更容易脆弱、认真，也更容易全心信任。'],
      HHHH:['傻乐者','哈哈哈哈哈哈。','你的脑回路太清奇，标准人格库一时集体罢工了。'],
      DRUNK:['酒鬼','烈酒烧喉，不得不醉。','特殊隐藏人格。不是人格库算出来的，是酒精异常因子直接接管。']
    };

    const displayNames = { CTRL:'CTRL', ATM:'ATM-er', DIOR:'Dior-s', BOSS:'BOSS', THANK:'THAN-K', OHNO:'OH-NO', GOGO:'GOGO', SEXY:'SEXY', LOVER:'LOVE-R', MUM:'MUM', FAKE:'FAKE', OJBK:'OJBK', MALO:'MALO', JOKER:'JOKE-R', WOC:'WOC!', THINK:'THIN-K', SHIT:'SHIT', ZZZZ:'ZZZZ', POOR:'POOR', MONK:'MONK', IMSB:'IMSB', SOLO:'SOLO', FUCK:'FUCK', DEAD:'DEAD', IMFW:'IMFW', HHHH:'HHHH', DRUNK:'DRUNK' };

    const order = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];
    const qList = document.getElementById('questionList');
    const answeredCount = document.getElementById('answeredCount');
    const totalCount = document.getElementById('totalCount');
    const resultBox = document.getElementById('resultBox');

    function allQuestions() {
      const extra = getAnswers()['drink_gate_q1'] === 'C' ? [specialQ2] : [];
      return [...regularQuestions, specialQ1, ...extra];
    }

    function render() {
      const all = [...regularQuestions, specialQ1];
      qList.innerHTML = all.map(renderQuestion).join('') + `<div id="conditionalWrap"></div>`;
      bindEvents();
      updateConditionalQuestion();
      updateAnsweredCount();
    }

    function renderQuestion(q) {
      return `
        <article class="card" id="card-${q.id}">
          <div class="qhead">
            <div class="qid">${q.id.startsWith('q') ? q.id.replace('q','') : '特'}</div>
            <div>
              <div class="qtext">${q.t}</div>
              ${q.dim ? `<div class="qmeta">维度：${q.dim} · ${dimensionExplain[q.dim].name}</div>` : `<div class="qmeta">特殊题</div>`}
            </div>
          </div>
          <div class="options">
            ${q.options.map(([k, label]) => `
              <div class="option">
                <label>
                  <input type="radio" name="${q.id}" value="${k}" />
                  <span><strong>${k}.</strong> ${label}</span>
                </label>
              </div>
            `).join('')}
          </div>
        </article>
      `;
    }

    function bindEvents() {
      qList.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', () => {
          updateConditionalQuestion();
          updateAnsweredCount();
        });
      });
    }

    function getAnswers() {
      const ids = [...regularQuestions.map(q => q.id), 'drink_gate_q1', 'drink_gate_q2'];
      const answers = {};
      ids.forEach(id => {
        const checked = document.querySelector(`input[name="${id}"]:checked`);
        if (checked) answers[id] = checked.value;
      });
      return answers;
    }

    function updateConditionalQuestion() {
      const wrap = document.getElementById('conditionalWrap');
      const ans = getAnswers()['drink_gate_q1'];
      if (ans === 'C') {
        if (!document.getElementById(`card-${specialQ2.id}`)) {
          wrap.innerHTML = renderQuestion(specialQ2);
          bindEvents();
        }
        totalCount.textContent = '32';
      } else {
        wrap.innerHTML = '';
        totalCount.textContent = '31';
      }
    }

    function updateAnsweredCount() {
      answeredCount.textContent = Object.keys(getAnswers()).filter(k => k !== 'drink_gate_q2' || getAnswers()['drink_gate_q1'] === 'C').length;
    }

    function level(score) {
      if (score <= 3) return 'L';
      if (score === 4) return 'M';
      return 'H';
    }

    function codeToNum(ch) { return ch === 'L' ? 1 : ch === 'M' ? 2 : 3; }

    function patternToArray(p) { return p.split('-').join('').split(''); }

    function compute() {
      const ans = getAnswers();
      const required = [...regularQuestions.map(q => q.id), 'drink_gate_q1'];
      if (ans['drink_gate_q1'] === 'C') required.push('drink_gate_q2');
      const missing = required.filter(id => !ans[id]);
      if (missing.length) {
        alert('还有题目没有完成，请先把当前应作答的题目全部答完。');
        return;
      }

      const dimScores = {};
      for (const dim of order) {
        const qs = regularQuestions.filter(q => q.dim === dim);
        const score = qs.reduce((sum, q) => {
          const opt = q.options.find(x => x[0] === ans[q.id]);
          return sum + (opt ? opt[2] : 0);
        }, 0);
        dimScores[dim] = { score, lv: level(score) };
      }

      const vector = order.map(dim => dimScores[dim].lv);
      let ranked = Object.entries(patterns).map(([code, pattern]) => {
        const arr = patternToArray(pattern);
        const distance = arr.reduce((sum, ch, i) => sum + Math.abs(codeToNum(ch) - codeToNum(vector[i])), 0);
        const exact = arr.reduce((sum, ch, i) => sum + (ch === vector[i] ? 1 : 0), 0);
        const similarity = Math.max(0, Math.round((1 - distance / 30) * 100));
        return { code, pattern, distance, exact, similarity };
      }).sort((a,b) => a.distance - b.distance || b.exact - a.exact || b.similarity - a.similarity);

      let chosen = ranked[0];
      let specialNote = '普通结果友情提示：本测试仅供娱乐，别拿它当诊断、面试、相亲、分手、招魂、算命或人生判决书。你可以笑，但别太当真。';

      if (ans['drink_gate_q2'] === 'B') {
        chosen = { code:'DRUNK', similarity:100, exact:15, distance:0, pattern:'special' };
        specialNote = '特殊结果友情提示：本测试仅供娱乐。隐藏人格和傻乐兜底都属于作者故意埋的损招，请勿把它当成医学、心理学、相学、命理学或灵异学依据。';
      } else if (chosen.similarity < 60) {
        chosen = { code:'HHHH', similarity: ranked[0].similarity, exact: ranked[0].exact, distance: ranked[0].distance, pattern:'fallback' };
        specialNote = `特殊结果友情提示：本测试仅供娱乐。标准人格库最高匹配仅 ${ranked[0].similarity}% ，系统已将你强制分配给 HHHH。`;
      }

      const txt = resultTexts[chosen.code];
      resultBox.classList.remove('hidden');
      resultBox.innerHTML = `
        <div class="code">${displayNames[chosen.code]}</div>
        <div class="small">匹配度：${chosen.code === 'DRUNK' ? '100% · 酒精异常因子已接管' : chosen.code === 'HHHH' ? chosen.similarity + '% · 标准人格库集体罢工' : chosen.similarity + '%'}</div>
        <h2>${txt[0]}</h2>
        <div class="intro">${txt[1]}</div>
        <p class="desc">${txt[2]}</p>
        <div class="pattern-grid">
          <div class="pattern-card">
            <h4>你的 15 维向量</h4>
            <div class="small">${order.map(dim => `${dim}:${dimScores[dim].lv}`).join(' ｜ ')}</div>
          </div>
          <div class="pattern-card">
            <h4>最佳常规匹配</h4>
            <div class="small">${ranked[0].code} ｜ ${displayNames[ranked[0].code]} ｜ ${ranked[0].pattern}</div>
          </div>
        </div>
        <div class="dim-grid">
          ${order.map(dim => `
            <div class="dim">
              <h3>${dim}｜${dimensionExplain[dim].name}</h3>
              <p>得分：${dimScores[dim].score} / 6</p>
              <p>等级：${dimScores[dim].lv}</p>
              <p>${dimensionExplain[dim][dimScores[dim].lv]}</p>
            </div>
          `).join('')}
        </div>
        <p class="small" style="margin-top:18px;">${specialNote}</p>
      `;
      resultBox.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    function resetAll() {
      document.querySelectorAll('input[type="radio"]').forEach(i => i.checked = false);
      document.getElementById('conditionalWrap').innerHTML = '';
      totalCount.textContent = '31';
      resultBox.classList.add('hidden');
      resultBox.innerHTML = '';
      updateAnsweredCount();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    render();
    document.getElementById('submitBtn').addEventListener('click', compute);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
  </script>
</body>
</html>
